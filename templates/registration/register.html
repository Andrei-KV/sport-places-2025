{% extends 'base/base.html' %}
{% load static %}
{% load filters %}
{% block title %}Регистрация{% endblock %}

{% block content %}
{% load static %}
<div class="container">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <h1>Зарегистрироваться</h1>
    <form method="post" class="place-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Имя пользователя или email</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label for="{{ form.password1.id_for_label }}">Пароль</label>
            {{ form.password1 }}
            <small class="form-text text-muted">{{ form.password.help_text|safe }}</small>
        </div>
    
        <div class="form-group">
            <label for="{{ form.password2.id_for_label }}">Подтверждение пароля</label>
            {{ form.password2 }}
        </div>
        <button type="submit" class="submit-btn">Создать аккаунт</button>
    </form>
</div>
{% endblock %}
